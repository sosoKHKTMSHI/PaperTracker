name: AMRIGS StudyOS CI

on:
  push:
    branches:
      - feature/amrigs-studyos-v0.1
  pull_request:
    paths:
      - 'amrigs_studyos/**'
      - '.github/workflows/amrigs-studyos-ci.yml'

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q amrigs_studyos
      - name: Database smoke test
        run: |
          python - <<'PY'
          import sys
          import tempfile
          from datetime import date
          from pathlib import Path
          sys.path.insert(0, str(Path('amrigs_studyos').resolve()))
          from studyos.db import Database
          from studyos.content_seed import seed_catalog
          from studyos.services import ensure_default_schedule, dashboard_stats
          with tempfile.TemporaryDirectory() as tmp:
              db = Database(Path(tmp) / 'test.sqlite3')
              seed_catalog(db)
              assert db.scalar('SELECT COUNT(*) FROM areas') == 5
              assert db.scalar('SELECT COUNT(*) FROM blocks') == 37
              assert db.scalar('SELECT COUNT(*) FROM macro_families') >= 120
              assert db.scalar('SELECT COUNT(*) FROM content_items') >= 300
              ensure_default_schedule(db, date(2026, 7, 6))
              assert db.scalar('SELECT COUNT(*) FROM planned_sessions') == 220
              assert dashboard_stats(db, '2026-07-06')['total_items'] >= 300
              db.close()
          PY
      - name: Install UI dependency
        run: python -m pip install -q -r amrigs_studyos/requirements.txt
      - name: UI dashboard core
        run: python amrigs_studyos/ui_smoke.py dashboard-core
      - name: UI dashboard area
        run: python amrigs_studyos/ui_smoke.py dashboard-area
      - name: UI dashboard priority
        run: python amrigs_studyos/ui_smoke.py dashboard-priority
      - name: UI dashboard widgets
        run: python amrigs_studyos/ui_smoke.py dashboard-widgets
      - name: UI dashboard
        run: python amrigs_studyos/ui_smoke.py dashboard
      - name: UI today
        run: python amrigs_studyos/ui_smoke.py today
      - name: UI schedule
        run: python amrigs_studyos/ui_smoke.py schedule
      - name: UI reviews
        run: python amrigs_studyos/ui_smoke.py reviews
      - name: UI content
        run: python amrigs_studyos/ui_smoke.py content
      - name: UI errors
        run: python amrigs_studyos/ui_smoke.py errors
      - name: UI telemetry
        run: python amrigs_studyos/ui_smoke.py telemetry
      - name: UI settings
        run: python amrigs_studyos/ui_smoke.py settings
      - name: UI main window
        run: python amrigs_studyos/ui_smoke.py main
